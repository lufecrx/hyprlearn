[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprlearn"
version = "0.1.0"
description = "HUD Interativo e Micro-Learning com Notificações Passivas para atalhos do Hyprland"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Luiz" }
]
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
hyprlearn = "hyprlearn.cli:main"
